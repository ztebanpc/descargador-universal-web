<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador Universal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Descargador <span class="accent">Universal</span></h1>
            <p>El motor central para todas tus descargas de Capcut</p>
        </header>

        <main class="modules-grid">
            <!-- Modulo de Audio -->
            <section class="card audio-card">
                <div class="card-header">
                    <h2>Módulo de Audio Inteligente</h2>
                    <p>YouTube, Instagram, TikTok o Búsqueda directa</p>
                </div>
                <div class="card-body">
                    <input type="text" id="audio-input" placeholder="Pega el enlace o escribe la canción..." />
                    <button onclick="downloadAudio()" class="btn btn-primary">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        Descargar Audio
                    </button>

                    <hr class="divider" />
                    <p class="section-label">O carga un archivo Excel con links:</p>
                    <input type="file" id="excel-input" accept=".xlsx,.xls,.csv" />
                    <button onclick="downloadExcel()" class="btn btn-outline">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                        Descargar MP3 desde Excel
                    </button>
                    <div id="audio-status" class="status-box"></div>
                </div>
            </section>

            <!-- Modulo de Pinterest -->
            <section class="card pinterest-card">
                <div class="card-header">
                    <h2>Módulo Pinterest Avanzado</h2>
                    <p>Tableros o Búsqueda Temática</p>
                </div>
                <div class="card-body">
                    <input type="text" id="pinterest-input" placeholder="URL del tablero o palabra clave (ej. perro chihuahua)..." />
                    
                    <div class="filters">
                        <div class="filter-group">
                            <label>Formato:</label>
                            <select id="pinterest-format">
                                <option value="any">Cualquiera</option>
                                <option value="9:16">Vertical (9:16)</option>
                                <option value="1:1">Cuadrado (1:1)</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Tipo:</label>
                            <select id="pinterest-type">
                                <option value="both">Ambos (Fotos y Videos)</option>
                                <option value="videos">Solo Videos</option>
                                <option value="photos">Solo Fotos</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="downloadPinterest()" class="btn btn-secondary">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        Descargar de Pinterest
                    </button>
                    <div id="pinterest-status" class="status-box"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        async function downloadAudio() {
            const query = document.getElementById('audio-input').value.trim();
            const statusBox = document.getElementById('audio-status');
            if(!query) return;

            statusBox.innerHTML = "⏳ Descargando con motor de alta potencia... Por favor espera.";
            statusBox.className = "status-box loading";

            try {
                const response = await fetch('/api/download_audio', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query})
                });
                const result = await response.json();
                if (result.status === 'success') {
                    statusBox.innerHTML = `✅ <strong>${result.title}</strong> completado.<br><a href="${result.download_url}" class="btn btn-primary" style="margin-top:10px; display:inline-flex;">📥 Guardar Archivo en mi Dispositivo</a>`;
                    statusBox.className = "status-box success";
                    // Iniciar descarga automáticamente
                    window.location.href = result.download_url;
                } else {
                    statusBox.innerHTML = `❌ Error: ${result.message}`;
                    statusBox.className = "status-box error";
                }
            } catch (error) {
                statusBox.innerHTML = "❌ Error de conexión al servidor";
                statusBox.className = "status-box error";
            }
        }

        async function downloadExcel() {
            const fileInput = document.getElementById('excel-input');
            const statusBox = document.getElementById('audio-status');
            if (!fileInput.files || fileInput.files.length === 0) {
                statusBox.innerHTML = 'Por favor selecciona un archivo Excel o CSV.';
                statusBox.className = 'status-box error';
                return;
            }
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            statusBox.innerHTML = '⏳ Procesando lista masiva en la nube...';
            statusBox.className = 'status-box loading';
            try {
                const response = await fetch('/api/download_excel', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.status === 'success') {
                    statusBox.innerHTML = `✅ ${result.message}<br><a href="/api/download_zip" class="btn btn-outline" style="margin-top:10px; display:inline-flex;">📦 Descargar Todos en ZIP</a>`;
                    statusBox.className = 'status-box success';
                } else {
                    statusBox.innerHTML = `❌ ${result.message}`;
                    statusBox.className = 'status-box error';
                }
            } catch (error) {
                statusBox.innerHTML = '❌ Error al procesar el Excel.';
                statusBox.className = 'status-box error';
            }
        }

        async function downloadPinterest() {
            const query = document.getElementById('pinterest-input').value.trim();
            const format = document.getElementById('pinterest-format').value;
            const type = document.getElementById('pinterest-type').value;
            const statusBox = document.getElementById('pinterest-status');
            if(!query) return;

            statusBox.innerHTML = "⏳ Extrayendo y descargando todas las fotos del tablero/búsqueda en alta resolución... Por favor espera.";
            statusBox.className = "status-box loading";

            try {
                const response = await fetch('/api/download_pinterest', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query, format, media_type: type})
                });
                const result = await response.json();
                if (result.status === 'success') {
                    statusBox.innerHTML = `✅ <strong>${result.message}</strong><br><a href="${result.download_zip}" class="btn btn-secondary" style="margin-top:10px; display:inline-flex;">📥 Descargar ZIP con las ${result.total} Fotos</a>`;
                    statusBox.className = "status-box success";
                    // Iniciar descarga del ZIP automáticamente
                    window.location.href = result.download_zip;
                } else {
                    statusBox.innerHTML = `❌ Error: ${result.message}`;
                    statusBox.className = "status-box error";
                }
            } catch (error) {
                statusBox.innerHTML = "❌ Error de conexión con el servidor";
                statusBox.className = "status-box error";
            }
        }
    </script>
</body>
</html>
